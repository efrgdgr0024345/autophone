name: Build public APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BlackCatKeyboardDebug.apk
          sha256sum BlackCatKeyboardDebug.apk > BlackCatKeyboardDebug.apk.sha256

      - name: Put latest APK at repository root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackCatKeyboardDebug.apk BlackCatKeyboardDebug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Update latest public APK [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BlackCatKeyboardDebug
          path: |
            BlackCatKeyboardDebug.apk
            BlackCatKeyboardDebug.apk.sha256

      - name: Publish/update public latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest BlackCatKeyboardDebug.apk BlackCatKeyboardDebug.apk.sha256 --clobber
          else
            gh release create latest BlackCatKeyboardDebug.apk BlackCatKeyboardDebug.apk.sha256 \
              --title "Black Cat Remote — Latest" \
              --notes "Automatic public test build from commit ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}"
          fi
