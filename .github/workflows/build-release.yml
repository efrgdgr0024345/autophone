# Do not overwrite the physically proven BlackCat-v2.apk.
name: Preview publication policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Use the CatAI-preview artifact from a successful Android CI run.'
          echo 'No automatic release, golden APK overwrite, tag change, or repository binary commit is allowed.'
          echo 'Physical Bluetooth and live user-key API validation remain separate gates.'
