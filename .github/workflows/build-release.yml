name: Build public APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BlackCatRemote.apk
          sha256sum BlackCatRemote.apk > BlackCatRemote.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BlackCatRemote
          path: |
            BlackCatRemote.apk
            BlackCatRemote.apk.sha256

      - name: Publish/update public latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest BlackCatRemote.apk BlackCatRemote.apk.sha256 --clobber
          else
            gh release create latest BlackCatRemote.apk BlackCatRemote.apk.sha256 \
              --title "Black Cat Remote — Latest" \
              --notes "Automatic public test build from commit ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}"
          fi
