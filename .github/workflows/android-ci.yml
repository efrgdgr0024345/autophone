name: Android CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Protect golden HID core and permission boundaries
        run: python3 tools/check_policy.py
      - name: Build, test and lint both variants
        run: gradle testOfflineDebugUnitTest testAiDebugUnitTest lintOfflineDebug lintAiDebug assembleOfflineDebug assembleAiDebug --continue --console=plain --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Inspect packaged APKs and create previews
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          mkdir -p preview
          for flavor in ai offline; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            python3 tools/check_apk.py "$apk" "$flavor" "$AAPT" | tee "preview/$flavor-manifest.txt"
          done
          cp app/build/outputs/apk/ai/debug/app-ai-debug.apk preview/CatAI-01.apk
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk preview/CatBT-01.apk
          git rev-parse HEAD > preview/SOURCE.txt
          printf '%s\n' 'TEST-SIGNED PREVIEWS. Physical Bluetooth and live user-key API tests pending.' > preview/STATUS.txt
          (cd preview && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: CatAI-preview-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
