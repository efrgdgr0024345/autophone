name: Verify OpenAI test secret
on:
  push:
    branches:
      - test/verify-openai-secret
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.openai_api_key }}
    steps:
      - name: Confirm secret is available without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_SECRET_STATUS=MISSING"
            exit 1
          fi
          echo "OPENAI_SECRET_STATUS=PRESENT"
