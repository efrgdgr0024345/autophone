name: Black Cat UI05 user-flow preview

on:
  push:
    branches: [feature/ui05-user-flow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, build, attest UI05
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify HID behavior, user flow, UI and API boundaries
        run: |
          python3 tools/check_policy.py
          python3 tools/test_policy.py -v
          python3 tools/check_mobile_ui.py
          python3 tools/test_mobile_ui.py -v

      - name: Build, test and lint both variants
        run: gradle testOfflineDebugUnitTest testAiDebugUnitTest lintOfflineDebug lintAiDebug assembleOfflineDebug assembleAiDebug --continue --console=plain --stacktrace

      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui05-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Inspect and package exact tested preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          mkdir -p preview
          for flavor in ai offline; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            python3 tools/check_apk.py "$apk" "$flavor" "$AAPT" | tee "preview/$flavor-manifest.txt"
            "$SIGNER" verify --verbose --print-certs "$apk" > "preview/$flavor-signature.txt"
          done
          cp app/build/outputs/apk/ai/debug/app-ai-debug.apk preview/CatAI-05.apk
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk preview/CatBT-05.apk
          git rev-parse HEAD > preview/SOURCE.txt
          git diff --stat ab34f45d7ef09f06e4d41873079b168e20df01f6 HEAD > preview/DIFFSTAT.txt
          printf '%s\n'             'UI05 is a physical-test prerelease candidate.'             'Flow: Connect → choose Remote/Assistant → Plan → Step → Preview → Result.'             'Main and assistant roots respect Android system-bar insets, including the bottom navigation area.'             'Diagnostics are collapsed and moved to the end of the main flow.'             'Bluetooth HID helper files, lifecycle/pairing/send behavior, key mappings and API transport remain protected by tests.'             > preview/README.txt
          (cd preview && sha256sum *.apk > SHA256SUMS)

      - name: Attest exact AI APK provenance
        uses: actions/attest@v4
        with:
          subject-path: preview/CatAI-05.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-ui05-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 90

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - run: gradle clean assembleOfflineDebug assembleAiDebug --console=plain --stacktrace
      - uses: github/codeql-action/analyze@v4
