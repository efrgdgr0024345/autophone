name: Black Cat UI03 preview
on:
  push:
    branches: [feature/mobile-blackcat-ui-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify frozen V2, API boundary and approved UI assets
        run: |
          python3 tools/check_policy.py
          python3 tools/test_policy.py -v
          python3 tools/check_mobile_ui.py
          python3 tools/test_mobile_ui.py -v
      - name: Build, test and lint both variants
        run: gradle testOfflineDebugUnitTest testAiDebugUnitTest lintOfflineDebug lintAiDebug assembleOfflineDebug assembleAiDebug --continue --console=plain --stacktrace
      - name: Upload complete reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui03-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Inspect and package exact tested preview bytes
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          mkdir -p preview
          for flavor in ai offline; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            python3 tools/check_apk.py "$apk" "$flavor" "$AAPT" | tee "preview/$flavor-manifest.txt"
            "$SIGNER" verify --verbose --print-certs "$apk" > "preview/$flavor-signature.txt"
          done
          cp app/build/outputs/apk/ai/debug/app-ai-debug.apk preview/CatAI-03.apk
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk preview/CatBT-03.apk
          git rev-parse HEAD > preview/SOURCE.txt
          printf '%s\n' 'UI03 is an unpromoted physical-test preview.' 'Bluetooth V2 and CatAI-02 preserved references remain untouched.' 'This build changes the AI-panel UI and version metadata only; the photo-feedback milestone is not included.' > preview/README.txt
          (cd preview && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-ui03-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - run: gradle clean assembleOfflineDebug assembleAiDebug --console=plain --stacktrace
      - uses: github/codeql-action/analyze@v4