name: Black Cat UI08 approved visual + photo preview

on:
  push:
    branches: [feature/ui08-approved-visual-photo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, build, attest UI08
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify golden HID behavior, approved UI and photo boundaries
        run: |
          python3 tools/check_policy.py
          python3 tools/test_policy.py -v
          python3 tools/check_mobile_ui.py
          python3 tools/test_mobile_ui.py -v

      - name: Guided planner/photo lab regression tests
        run: |
          python3 -m pip install -r planner_lab/requirements.txt
          python3 -m unittest planner_lab.test_contract -v

      - name: Build, unit test and lint both variants
        run: gradle testOfflineDebugUnitTest testAiDebugUnitTest lintOfflineDebug lintAiDebug assembleOfflineDebug assembleAiDebug --continue --console=plain --stacktrace

      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui08-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Inspect and package exact tested preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          mkdir -p preview
          for flavor in ai offline; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            python3 tools/check_apk.py "$apk" "$flavor" "$AAPT" | tee "preview/$flavor-manifest.txt"
            "$SIGNER" verify --verbose --print-certs "$apk" > "preview/$flavor-signature.txt"
          done
          cp app/build/outputs/apk/ai/debug/app-ai-debug.apk preview/CatAI-08.apk
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk preview/CatBT-08.apk
          git rev-parse HEAD > preview/SOURCE.txt
          git diff --stat c9cb8c3572c5bf25a7efd241870552c0d37460a7 HEAD > preview/DIFFSTAT.txt
          printf '%s\n'             'UI08 applies the approved 12-screen reference design above the tested UI07 photo-enabled golden lineage.'             'Golden HID helpers, computer-initiated pairing, lifecycle, key mappings, text-send, planner and photo-analysis paths remain protected by tests.'             'Visual: splash, home, Bluetooth, assistant workflow, target/custom target, settings, camera and sending-photo screens; full Black Cat on white with dark panels and green accents.'             'Assistant: Plan → Step → Feedback → Preview; saved target selection and Edit/custom.'             'Photo: in-panel Camera2 capture → review → explicit OpenAI send → structured analysis → separately reviewed TYPE ONLY.'             'No automatic Enter, run-all, hidden replay, broad gallery permission or microphone permission.'             > preview/README.txt
          (cd preview && sha256sum *.apk > SHA256SUMS)

      - name: Attest exact AI APK provenance
        uses: actions/attest@v4
        with:
          subject-path: preview/CatAI-08.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-ui08-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 90

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - run: gradle clean assembleOfflineDebug assembleAiDebug --console=plain --stacktrace
      - uses: github/codeql-action/analyze@v4
