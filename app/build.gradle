plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.blackcat.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.blackcat.remote'
        minSdk 28
        targetSdk 35
        versionCode 23
        versionName '20.0-signed-updates'
    }
    flavorDimensions 'capability'
    productFlavors {
        offline { dimension 'capability' }
        ai {
            dimension 'capability'
            testInstrumentationRunner 'com.blackcat.remote.FeedbackSmokeInstrumentation'
        }
    }
    // Preview is non-debuggable. Both flavors use the original identity, never a second HID app.
    buildTypes { debug { debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true; textReport true; xmlReport true; htmlReport true }
}
dependencies {
    // AI-only APK signature verification; same pinned version as the Android build tools.
    aiImplementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testAiImplementation 'org.json:json:20240303'
}
