plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.blackcat.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.blackcat.remote'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '2.1-ai-preview.1'
    }
    flavorDimensions 'capability'
    productFlavors {
        offline { dimension 'capability' }
        ai {
            dimension 'capability'
            applicationIdSuffix '.ai'
        }
    }
    // CI produces test-signed previews, but API credentials must not live in a debuggable APK.
    buildTypes { debug { debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true; textReport true; xmlReport true; htmlReport true }
}
dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testAiImplementation 'org.json:json:20240303'
}
